# The bundle layer this package installs as.
#
# dsh installs a plugin by selecting a *bundle*: a package that declares
# `dsh.bundle.patch` and ships the patch that file names. Selecting this bundle
# applies the layer below, which is what puts the panel in a profile's
# composition — so a profile that installs the package needs no patch of its
# own, and one that is installed alongside this layer must not write a second
# insert of its own row.
#
# The row id and the module name are both the package name, and that is the
# third place this identity is stated: `PACKAGE` in tsdown.config.ts stamps the
# browser bundle's registration id, package.json declares the package, and this
# file names the row a profile composes. `tests/release.spec.ts` fails when they
# disagree, because a bundle whose row loads a name its package does not declare
# fails at startup with nothing on the page to explain it.

- insert:
    - id: dsh-modelspec
      name: 'dsh-modelspec'
