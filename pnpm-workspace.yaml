# pnpm settings for this package.
#
# `minimumReleaseAge` is pnpm's supply-chain policy: a lockfile entry younger
# than the cutoff is refused. The `@deepseek-ai/dsh-*` packages this plugin pins
# are published by the harness release, so a release cut within that cutoff (as
# `0.2.1-rc.2` was) cannot be installed under the policy as it stands — locally
# or on the publish runner, which is where it failed first.
#
# The exemptions below name exact versions, not ranges: the plugin's control is
# still that `package.json` pins each harness package exactly, and this list only
# records that those pins were reviewed. pnpm regenerates it when a release
# brings newer pinned versions; commit the updated file with that bump.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-include@1.0.10'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
